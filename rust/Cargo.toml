[package]
name = "autopay"
version = "1.0.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
description = "Keeps an Unaligned balance topped up, in crypto"
publish = false

[dependencies]
alloy = { version = "2.5.0", features = ["provider-http", "signer-local", "sol-types", "contract", "network", "reqwest-rustls-tls"] }
anyhow = "1.0.104"
async-trait = "0.1.92"
bs58 = "0.5.1"
hex = "0.4.3"
humantime = "2.4.0"
md-5 = "0.11.0"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
solana-commitment-config = "3.1.1"
solana-rpc-client = "4.4.1"
solana-sdk = "5.0.0"
solana-system-interface = { version = "3.3.0", features = ["bincode"] }
spl-associated-token-account-interface = "2.0.0"
spl-token-2022-interface = "4.0.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "signal", "net", "io-util"] }
