<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d">
  <title id="t">Unaligned Autopay</title>
  <desc id="d">Keep your Unaligned balance topped up in crypto, unattended. Five languages: TypeScript, JavaScript, Python, Go, Rust.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c1a18" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0c0b" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#0d0c0b" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0d0c0b" stop-opacity="0"/>
    </linearGradient>
    <style>
      .display { font-family: 'Unbounded', 'Inter', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; }
      .sans { font-family: 'Inter', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    </style>
  </defs>

  <rect width="1280" height="440" fill="#0d0c0b"/>
  <rect width="1280" height="440" fill="url(#grid)"/>
  <rect width="1280" height="440" fill="url(#fade)"/>

  <!-- logo -->
  <rect x="72" y="64" width="22" height="22" fill="#edebe7"/>
  <rect x="84" y="76" width="22" height="22" fill="#e5322d"/>
  <text x="122" y="91" class="display" font-size="26" fill="#edebe7">Unaligned</text>

  <!-- title -->
  <text x="72" y="198" class="display" font-size="78" fill="#edebe7" letter-spacing="-1">Autopay<tspan fill="#e5322d">.</tspan></text>
  <text x="74" y="252" class="sans" font-size="26" fill="#9a958e">Your balance tops itself up, in crypto, while no one is watching.</text>

  <!-- language chips -->
  <g class="mono" font-size="15" fill="#edebe7" letter-spacing="1">
    <rect x="72" y="320" width="136" height="40" fill="none" stroke="#3a3733"/>
    <text x="140" y="345" text-anchor="middle">TYPESCRIPT</text>
    <rect x="218" y="320" width="136" height="40" fill="none" stroke="#3a3733"/>
    <text x="286" y="345" text-anchor="middle">JAVASCRIPT</text>
    <rect x="364" y="320" width="104" height="40" fill="none" stroke="#3a3733"/>
    <text x="416" y="345" text-anchor="middle">PYTHON</text>
    <rect x="478" y="320" width="64" height="40" fill="none" stroke="#3a3733"/>
    <text x="510" y="345" text-anchor="middle">GO</text>
    <rect x="552" y="320" width="80" height="40" fill="none" stroke="#3a3733"/>
    <text x="592" y="345" text-anchor="middle">RUST</text>
  </g>

  <!-- squares motif -->
  <rect x="880" y="78" width="190" height="190" fill="#edebe7"/>
  <rect x="984" y="182" width="190" height="190" fill="#e5322d"/>

  <!-- a mini terminal on the motif -->
  <g class="mono" font-size="14">
    <rect x="800" y="296" width="290" height="96" fill="#151412" stroke="#262422"/>
    <circle cx="816" cy="312" r="4" fill="#3a3733"/>
    <circle cx="830" cy="312" r="4" fill="#3a3733"/>
    <circle cx="844" cy="312" r="4" fill="#3a3733"/>
    <text x="816" y="342" fill="#615d57">$ <tspan fill="#edebe7">autopay watch</tspan></text>
    <text x="816" y="364" fill="#9a958e">sent 0x9f3c…e41a</text>
    <text x="816" y="384" fill="#7fb685">done 6f1c2e0a… (paid)</text>
  </g>

  <text x="1208" y="414" text-anchor="end" class="mono" font-size="15" fill="#615d57">unaligned.pw</text>
  <rect y="434" width="1280" height="6" fill="#e5322d"/>
</svg>
